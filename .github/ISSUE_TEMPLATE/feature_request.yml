name: Feature request
description: Suggest an idea or a missing capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, in your own words. What do your schema and your index look like?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working, for example a config option, a Studio feature or a new sink.
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: Workarounds, or other tools you've tried.
