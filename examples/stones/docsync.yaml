# docsync example configuration for the fictional stone inventory in schema.sql.
# Point DOCSYNC_DSN at the database, for example:
#   export DOCSYNC_DSN='sqlserver://user:password@localhost:1433?database=stones'

source:
  type: sqlserver
  dsn_env: DOCSYNC_DSN
  poll_interval: 1s        # how often an idle engine checks for changes
  assemble_budget: 5000    # documents assembled per cycle at most

document:
  name: stone
  root: { table: dbo.stone, key: [stoneid] }
  fragments:
    # cardinality one (default): columns become top-level fields.
    - name: details
      sql: |
        SELECT r.id AS _root,
               s.stoneid, s.packet_no, s.carat, s.shape, s.color, s.clarity,
               s.status, s.certified_on, s.updated_at,
               s.lab_code, l.name AS lab_name, l.country AS lab_country
        FROM {{roots}} r
        JOIN dbo.stone s ON s.stoneid = r.id
        LEFT JOIN dbo.lab l ON l.code = s.lab_code

    # cardinality many: rows become a nested list, ordered by sort_key.
    - name: inclusions
      cardinality: many
      path: inclusions
      sort_key: [position, inclusion_id]
      sql: |
        SELECT r.id AS _root, i.inclusion_id, i.kind, i.position, i.severity
        FROM {{roots}} r
        JOIN dbo.inclusion i ON i.stoneid = r.id

    # Calculated fields can combine several tables in plain SQL.
    - name: rates
      cardinality: many
      path: rates
      sort_key: [rate_type, rate_id]
      sql: |
        SELECT r.id AS _root, rt.rate_id, rt.rate_type, rt.amount, rt.currency,
               CAST(rt.amount / NULLIF(s.carat, 0) AS decimal(18,2)) AS amount_per_carat
        FROM {{roots}} r
        JOIN dbo.rate rt ON rt.stoneid = r.id
        JOIN dbo.stone s ON s.stoneid = r.id

    - name: orders
      cardinality: many
      path: orders
      sort_key: [order_id]
      sql: |
        SELECT r.id AS _root, oh.order_id, oh.party, oh.order_date, oh.status,
               (SELECT COUNT(*) FROM dbo.order_line ol WHERE ol.order_id = oh.order_id) AS line_count,
               (SELECT ISNULL(SUM(ol.amount), 0) FROM dbo.order_line ol WHERE ol.order_id = oh.order_id) AS order_total
        FROM {{roots}} r
        JOIN dbo.order_stone os ON os.stoneid = r.id
        JOIN dbo.order_header oh ON oh.order_id = os.order_id

    - name: summary
      sql: |
        SELECT r.id AS _root,
               (SELECT COUNT(*) FROM dbo.inclusion i WHERE i.stoneid = r.id) AS inclusion_count,
               (SELECT MAX(i.severity) FROM dbo.inclusion i WHERE i.stoneid = r.id) AS worst_severity,
               (SELECT COUNT(*) FROM dbo.order_stone os WHERE os.stoneid = r.id) AS order_count
        FROM {{roots}} r

# How a change in each table reaches stones. "references": this row holds the next
# table's columns. "referenced_by": rows of the next table hold this row's columns.
routing:
  - { table: dbo.inclusion,    key: [inclusion_id],      next: { table: dbo.stone,        join: { stoneid: stoneid },  kind: references } }
  - { table: dbo.rate,         key: [rate_id],           next: { table: dbo.stone,        join: { stoneid: stoneid },  kind: references } }
  - { table: dbo.lab,          key: [lab_id],            next: { table: dbo.stone,        join: { code: lab_code },    kind: referenced_by }, hot_fanout_limit: 2000 }
  - { table: dbo.order_stone,  key: [order_id, stoneid], next: { table: dbo.stone,        join: { stoneid: stoneid },  kind: references } }
  - { table: dbo.order_header, key: [order_id],          next: { table: dbo.order_stone,  join: { order_id: order_id }, kind: referenced_by } }
  - { table: dbo.order_line,   key: [line_id],           next: { table: dbo.order_header, join: { order_id: order_id }, kind: references } }

sinks:
  - type: parquet_log
    dir: ./out/parquet
    segment_interval: 2s
    base_every: 15m
    retain_segments: 1h
    include_json: true

state:
  dir: ./state
  outbox_retention: 2h

dashboard:
  listen: 127.0.0.1:8088
